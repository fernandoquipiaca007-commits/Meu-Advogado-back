spring:
    application:
        name: upwork
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:prod}
debug: ${DEBUG:false}
logging:
    level:
        org.springframework.boot.autoconfigure: ERROR
        org.springframework.core: ERROR

legawork:
    features:
        financials:
            stripe-enabled: true    # Sandbox credentials configured — safe to enable
        payouts:
            paypal-enabled: false
        funds:
            hold-enabled: false
        automation:
            auto-release-enabled: false
        auth:
            cookie-session-enabled: false